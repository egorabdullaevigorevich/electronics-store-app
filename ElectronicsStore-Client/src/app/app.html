<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Electronics Store, на главную">
    <span class="brand-mark" aria-hidden="true">⚡</span>
    <span>Electronics Store</span>
  </a>

  <nav class="site-nav" aria-label="Основная навигация">
    @if (authService.isAuthenticated()) {
      <span class="user-name"><span aria-hidden="true">&#9679;</span>{{ authService.currentUsername() }}</span>
      <button class="nav-button nav-button--quiet" (click)="authService.logout()">Выйти</button>
    } @else {
      <button class="nav-button nav-button--primary" routerLink="/login">Войти</button>
    }
  </nav>
</header>

<router-outlet></router-outlet>
